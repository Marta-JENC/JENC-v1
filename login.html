<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1B2E;
    --card: rgba(18, 40, 63, 0.72);
    --accent: #D4A94A;
    --text: #F4F0E4;
    --muted: #C9D6E5;
    --border: rgba(212, 169, 74, 0.35);
    --erro: #FF6B6B;
  }
  * { box-sizing: border-box; }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }

  .fundo-foto {
    position: fixed; inset: 0; z-index: -2;
    background-image: url("lisboa-azulejo.jpg");
    background-size: cover;
    background-position: center 35%;
  }
  .fundo-veu {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(10,27,46,0.78) 0%, rgba(10,27,46,0.55) 45%, rgba(10,27,46,0.85) 100%);
  }
  .faixa-topo {
    position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 3;
    background: linear-gradient(90deg, #8A6A22, var(--accent) 25%, #E8C873 50%, var(--accent) 75%, #8A6A22);
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    position: relative;
  }
  .caixa {
    width: 100%;
    max-width: 380px;
    position: relative;
    z-index: 2;
    background: var(--card);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 26px;
  }
  .marca { text-align: center; margin-bottom: 6px; }
  .marca .jenc { font-size: 34px; letter-spacing: 0.02em; }
  .marca .tema {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500;
    color: var(--accent); font-size: 15px; margin-top: 2px;
  }
  h1 { font-size: 24px; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; text-align: center; }

  label { font-size: 13px; color: var(--muted); display: block; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(10,27,46,0.55); color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  button.principal {
    width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: #0A1B2E; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button.principal:disabled { opacity: 0.6; cursor: default; }

  .mensagem { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .mensagem.erro { color: var(--erro); }
  .mensagem.sucesso { color: #7CD992; }
</style>
</head>
<body>

  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>
  <div class="faixa-topo" aria-hidden="true"></div>

  <div class="caixa">
    <div class="marca">
      <h1 class="jenc">JENC</h1>
      <div class="tema">Futuro sobre o Tejo</div>
    </div>
    <p class="sub">Entra com a tua conta (participante ou staff).</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="tu@exemplo.com" autocomplete="email">

    <label for="password">Palavra-passe</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

    <button class="principal" id="botao-principal" onclick="entrar()">Entrar</button>

    <div class="mensagem" id="mensagem"></div>
  </div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    // Se já houver sessão ativa, descobre o tipo de conta e salta logo
    // para a página certa (participante ou staff).
    verificarSessaoExistente();
    async function verificarSessaoExistente() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) await redirecionarConformeTipo(session.user);
    }

    async function entrar() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const botao = document.getElementById('botao-principal');

      if (!email || !password) {
        mostrarMensagem('Preenche o email e a palavra-passe.', 'erro');
        return;
      }

      botao.disabled = true;
      mostrarMensagem('A processar…');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        mostrarMensagem(traduzirErro(error), 'erro');
        botao.disabled = false;
        return;
      }

      const encontrouConta = await redirecionarConformeTipo(data.user);
      if (!encontrouConta) {
        mostrarMensagem('Esta conta não está associada a nenhum participante nem membro de staff. Contacta a organização.', 'erro');
        await supabaseClient.auth.signOut();
        botao.disabled = false;
      }
    }

    // Verifica se o utilizador tem linha em `staff` ou em `participantes`
    // e redireciona para a página correspondente. Devolve false se não
    // encontrar nenhuma das duas (conta sem acesso).
    async function redirecionarConformeTipo(user) {
      const { data: staff } = await supabaseClient
        .from('staff')
        .select('id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (staff) {
        window.location.href = 'staff-inicio.html';
        return true;
      }

      const { data: participante } = await supabaseClient
        .from('participantes')
        .select('id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (participante) {
        window.location.href = 'inicio.html';
        return true;
      }

      return false;
    }

    function traduzirErro(error) {
      const msg = error.message || '';
      if (msg.includes('Invalid login credentials')) return 'Email ou palavra-passe incorretos.';
      return 'Ocorreu um erro: ' + msg;
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'mensagem' + (tipo ? ' ' + tipo : '');
    }
  </script>

</body>
</html>
