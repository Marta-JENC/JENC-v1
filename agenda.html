<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — JENC</title>
<style>
  :root {
    --bg: #0F1B2B;
    --card: #16263D;
    --accent: #FF7A45;
    --text: #F2F4F7;
    --muted: #8FA0B8;
    --border: #23374F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    max-width: 480px;
    margin-inline: auto;
  }
  .voltar {
    display: inline-block;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 14px;
  }
  h1 { font-size: 22px; margin: 0 0 18px; }

  .abas-dias {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
  }
  .aba-dia {
    flex-shrink: 0;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .aba-dia.ativa {
    background: var(--accent);
    color: #201007;
    border-color: var(--accent);
  }

  .item-atividade {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
  }
  .item-atividade .hora {
    font-weight: 600;
    font-size: 14px;
    width: 48px;
    flex-shrink: 0;
    color: var(--accent);
  }
  .item-atividade .info .nome { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .item-atividade .info .local { font-size: 12px; color: var(--muted); }
  .item-atividade .estado {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    align-self: flex-start;
    margin-left: auto;
  }
  .estado.agora { background: #FF7A4530; color: var(--accent); }
  .estado.seguinte { background: #7CD99230; color: #7CD992; }

  .vazio, .carregamento {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }
</style>
</head>
<body>

  <a class="voltar" href="inicio.html">← Início</a>
  <h1>Agenda completa</h1>

  <div class="abas-dias" id="abas-dias"></div>
  <div id="lista-atividades"></div>
  <div class="carregamento" id="carregamento">A carregar agenda…</div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    let atividadesPorDia = {}; // { "2026-06-14": [ {...}, {...} ], ... }
    let diaSelecionado = null;

    init();

    async function init() {
      const user = await exigirSessao();
      if (!user) return;

      const atividades = await getTodasAtividades();

      if (atividades.length === 0) {
        document.getElementById('carregamento').textContent = 'Ainda não há atividades publicadas.';
        return;
      }

      agruparPorDia(atividades);
      renderAbasDias();

      // Seleciona por defeito: o dia de hoje, se existir agenda para hoje;
      // caso contrário, o primeiro dia disponível.
      const hoje = new Date().toISOString().split('T')[0];
      diaSelecionado = atividadesPorDia[hoje] ? hoje : Object.keys(atividadesPorDia)[0];

      renderListaDoDia(diaSelecionado);
      document.getElementById('carregamento').style.display = 'none';
    }

    async function getTodasAtividades() {
      const { data, error } = await supabaseClient
        .from('atividades')
        .select('id, nome, data, hora_inicio, hora_fim, local, local_id')
        .order('data', { ascending: true })
        .order('hora_inicio', { ascending: true });

      if (error) {
        console.error('Erro ao ir buscar atividades:', error.message, error.details, error.hint);
        return [];
      }
      return data;
    }

    function agruparPorDia(atividades) {
      atividadesPorDia = {};
      atividades.forEach(a => {
        if (!atividadesPorDia[a.data]) atividadesPorDia[a.data] = [];
        atividadesPorDia[a.data].push(a);
      });
    }

    function formatarRotuloDia(dataISO) {
      const hoje = new Date().toISOString().split('T')[0];
      const d = new Date(dataISO + 'T00:00:00');
      const rotulo = d.toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: 'short' });
      return dataISO === hoje ? `Hoje` : rotulo;
    }

    function renderAbasDias() {
      const container = document.getElementById('abas-dias');
      container.innerHTML = '';

      Object.keys(atividadesPorDia).forEach(dataISO => {
        const aba = document.createElement('div');
        aba.className = 'aba-dia' + (dataISO === diaSelecionado ? ' ativa' : '');
        aba.textContent = formatarRotuloDia(dataISO);
        aba.onclick = () => {
          diaSelecionado = dataISO;
          renderAbasDias();
          renderListaDoDia(dataISO);
        };
        container.appendChild(aba);
      });
    }

    function renderListaDoDia(dataISO) {
      const container = document.getElementById('lista-atividades');
      container.innerHTML = '';

      const atividades = atividadesPorDia[dataISO] || [];
      if (atividades.length === 0) {
        container.innerHTML = '<div class="vazio">Sem atividades neste dia.</div>';
        return;
      }

      const agora = new Date();
      const hojeISO = agora.toISOString().split('T')[0];

      // Encontra a próxima atividade (só faz sentido destacar isto no dia de hoje)
      let proximaId = null;
      if (dataISO === hojeISO) {
        const futura = atividades.find(a => new Date(`${a.data}T${a.hora_inicio}`) > agora);
        proximaId = futura ? futura.id : null;
      }

      atividades.forEach(a => {
        const inicio = new Date(`${a.data}T${a.hora_inicio}`);
        const fim = a.hora_fim ? new Date(`${a.data}T${a.hora_fim}`) : null;
        const aDecorrer = dataISO === hojeISO && fim && agora >= inicio && agora <= fim;

        const item = document.createElement('div');
        item.className = 'item-atividade';
        item.innerHTML = `
          <div class="hora">${a.hora_inicio?.slice(0,5) ?? '--:--'}</div>
          <div class="info">
            <div class="nome">${a.nome}</div>
            <div class="local">📍 ${a.local ?? 'Local a anunciar'}</div>
            ${a.local_id ? `<a href="mapa.html?local=${a.local_id}" style="font-size:12px; color:var(--accent); text-decoration:none;">Ver no mapa →</a>` : ''}
          </div>
          ${aDecorrer ? '<div class="estado agora">Agora</div>' : ''}
          ${!aDecorrer && a.id === proximaId ? '<div class="estado seguinte">A seguir</div>' : ''}
        `;
        container.appendChild(item);
      });
    }
  </script>

</body>
</html>
