<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipa — Staff JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1B2E;
    --card: rgba(18, 40, 63, 0.82);
    --accent: #D4A94A;
    --text: #F4F0E4;
    --muted: #7E97B0;
    --border: #1F3B57;
  }
  * { box-sizing: border-box; }
  .fundo-foto {
    position: fixed; inset: 0; z-index: -2;
    background-image: url("lisboa-simples.jpg");
    background-size: cover;
    background-position: center 55%;
  }
  .fundo-veu {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(10,27,46,0.55) 0%, rgba(10,27,46,0.72) 55%, rgba(10,27,46,0.88) 100%);
  }
  .card, [class*="card"], [class*="item-"], [class*="cartao"], [class*="aba"], .painel-detalhe, [class*="campo"], input, .rotulo-funcao {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
  body {
    margin: 0;
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    max-width: 520px;
    margin-inline: auto;
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .nav-staff { display: flex; gap: 8px; }
  .nav-staff a, .nav-staff button {
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:14px; padding:6px 10px; border-radius:8px; cursor:pointer; text-decoration:none;
  }

  .campo-busca {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .campo-busca:focus { outline: none; border-color: var(--accent); }

  .rotulo-funcao {
    font-size: 12px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 18px 0 8px;
  }
  .rotulo-funcao:first-of-type { margin-top: 0; }

  .card-pessoa {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .card-pessoa .nome { font-size: 14px; font-weight: 600; }
  .card-pessoa .funcao { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .acoes-contacto { display: flex; gap: 6px; flex-shrink: 0; }
  .acoes-contacto a {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-size: 14px;
  }
  .acoes-contacto a.desativado { opacity: 0.3; pointer-events: none; }

  .vazio, .estado-carregamento { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>Equipa</h1>
      <p class="sub">Contactos de toda a equipa de staff.</p>
    </div>
    <div class="nav-staff">
      <a href="staff-inicio.html" title="Início">🏠</a>
      <button onclick="terminarSessaoStaff()">Sair</button>
    </div>
  </header>

  <input type="text" class="campo-busca" id="campo-busca" placeholder="Procurar por nome ou função…">

  <div id="lista-equipa"></div>

  <div class="estado-carregamento" id="carregamento">A carregar equipa…</div>

  <!-- 1. Biblioteca do Supabase como script normal (não é módulo) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. O teu cliente Supabase -->
  <script src="supabaseClient.js"></script>

  <script>
    let equipa = [];

    init();

    document.getElementById('campo-busca').addEventListener('input', (e) => {
      renderEquipa(filtrar(e.target.value));
    });

    async function init() {
      const user = await exigirSessaoStaff();
      if (!user) return;

      const staff = await getStaffAtual(user);
      if (!staff) {
        document.getElementById('carregamento').textContent = 'Conta sem acesso de staff.';
        return;
      }

      equipa = await getDiretorioEquipa();
      renderEquipa(equipa);
      document.getElementById('carregamento').style.display = 'none';
    }

    async function getDiretorioEquipa() {
      const { data, error } = await supabaseClient.rpc('diretorio_equipa');
      if (error) {
        console.error('Erro ao ir buscar a equipa:', error.message, error.details, error.hint);
        return [];
      }
      return data ?? [];
    }

    function filtrar(termo) {
      const t = termo.trim().toLowerCase();
      if (!t) return equipa;
      return equipa.filter(p =>
        (p.nome ?? '').toLowerCase().includes(t) ||
        (p.funcao ?? '').toLowerCase().includes(t)
      );
    }

    function renderEquipa(lista) {
      const container = document.getElementById('lista-equipa');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = '<div class="vazio">Ninguém encontrado.</div>';
        return;
      }

      let ultimaFuncao = null;

      lista.forEach(p => {
        const funcaoRotulo = p.funcao || 'Sem função definida';
        if (funcaoRotulo !== ultimaFuncao) {
          const rotulo = document.createElement('div');
          rotulo.className = 'rotulo-funcao';
          rotulo.textContent = funcaoRotulo;
          container.appendChild(rotulo);
          ultimaFuncao = funcaoRotulo;
        }

        const card = document.createElement('div');
        card.className = 'card-pessoa';
        card.innerHTML = `
          <div>
            <div class="nome">${p.nome ?? '—'}</div>
            <div class="funcao">${p.email ?? ''}</div>
          </div>
          <div class="acoes-contacto">
            <a href="tel:${p.telefone ?? ''}" class="${p.telefone ? '' : 'desativado'}" title="Ligar">📞</a>
            <a href="mailto:${p.email ?? ''}" class="${p.email ? '' : 'desativado'}" title="Email">✉️</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function terminarSessaoStaff() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
