<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in — Staff JENC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1B2E;
    --card: rgba(18, 40, 63, 0.82);
    --accent: #D4A94A;
    --text: #F4F0E4;
    --muted: #7E97B0;
    --border: #1F3B57;
    --erro: #FF6B6B;
    --sucesso: #7CD992;
  }
  * { box-sizing: border-box; }
  .fundo-foto {
    position: fixed; inset: 0; z-index: -2;
    background-image: url("lisboa-simples.jpg");
    background-size: cover;
    background-position: center 55%;
  }
  .fundo-veu {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(10,27,46,0.55) 0%, rgba(10,27,46,0.72) 55%, rgba(10,27,46,0.88) 100%);
  }
  .card, [class*="card"], [class*="item-"], [class*="cartao"], [class*="aba"], .painel-detalhe, [class*="campo"], input, .rotulo-funcao {
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
  body {
    margin: 0;
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    max-width: 520px;
    margin-inline: auto;
  }
  header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  button.sair {
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer;
  }

  .aviso-camara {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: none;
  }

  #reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--card);
  }

  .entrada-manual {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .entrada-manual input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
  }
  .entrada-manual button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0A1B2E;
    font-weight: 600;
    cursor: pointer;
  }

  .mensagem { font-size: 13px; text-align: center; margin-bottom: 16px; min-height: 18px; }
  .mensagem.erro { color: var(--erro); }
  .mensagem.sucesso { color: var(--sucesso); }

  .cartao-perfil {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: none;
  }
  .cartao-perfil .nome { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .cartao-perfil .junior { color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 18px; }

  .linha-perfil {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .linha-perfil:last-of-type { border-bottom: none; }
  .linha-perfil .rotulo { color: var(--muted); }
  .linha-perfil .valor { font-weight: 600; text-align: right; }
  .linha-perfil .valor.alerta { color: var(--erro); }

  .agenda-hoje { margin-top: 16px; }
  .agenda-hoje h4 { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .item-agenda {
    display: flex; gap: 10px; font-size: 13px; padding: 6px 0;
  }
  .item-agenda .hora { color: var(--accent); font-weight: 600; width: 44px; flex-shrink: 0; }

  .acoes-checkin { margin-top: 20px; }
  .acoes-checkin .linha-tipo { display: flex; gap: 6px; margin-bottom: 10px; }
  .tipo-opcao {
    flex: 1; text-align: center; padding: 8px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; cursor: pointer;
  }
  .tipo-opcao.ativo { background: var(--accent); color: #0A1B2E; border-color: var(--accent); font-weight: 600; }
  .linha-acoes { display: flex; gap: 8px; }
  .botao-acao {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .botao-acao.entrada { background: var(--sucesso); color: #08331a; }
  .botao-acao.saida { background: var(--erro); color: #3a0b0b; }

  .estado-carregamento { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  .secao-extra { margin-top: 14px; }
  .botao-secao-extra {
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .painel-secao-extra { display: none; margin-top: 8px; }
  .painel-secao-extra.aberto { display: block; }

  .linha-recente {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 6px; font-size: 13px;
  }
  .linha-recente .detalhe-recente { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .linha-recente .tag-acao {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-right: 6px;
  }
  .linha-recente .tag-acao.entrada { background: var(--sucesso); color: #08331a; }
  .linha-recente .tag-acao.saida { background: var(--erro); color: #3a0b0b; }
  .botao-anular {
    flex-shrink: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--erro);
    background: none; color: var(--erro); font-size: 11px; font-weight: 700; cursor: pointer;
  }

  .cabecalho-faltam { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .lista-faltam { max-height: 320px; overflow-y: auto; }
  .item-falta {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px; font-size: 13px;
  }
</style>
</head>
<body>
  <div class="fundo-foto" aria-hidden="true"></div>
  <div class="fundo-veu" aria-hidden="true"></div>

  <header>
    <div>
      <h1>Check-in</h1>
      <p class="sub" id="saudacao-staff">A carregar…</p>
    </div>
    <div style="display:flex; gap:8px;">
      <a href="staff-inicio.html" style="background:none; border:1px solid var(--border); color:var(--muted); font-size:14px; padding:6px 10px; border-radius:8px; text-decoration:none;" title="Início">🏠</a>
      <button class="sair" onclick="terminarSessaoStaff()">Sair</button>
    </div>
  </header>

  <div id="aviso-camara" class="aviso-camara"></div>
  <div id="reader"></div>

  <div class="entrada-manual">
    <input type="text" id="input-manual" placeholder="Ou escreve o código (ex: JENC-001)">
    <button onclick="procurarManual()">Procurar</button>
  </div>

  <div class="mensagem" id="mensagem"></div>

  <div class="cartao-perfil" id="cartao-perfil">
    <div class="nome" id="p-nome">—</div>
    <div class="junior" id="p-junior">—</div>

    <div class="linha-perfil"><span class="rotulo">Universidade</span><span class="valor" id="p-universidade">—</span></div>
    <div class="linha-perfil"><span class="rotulo">Restrições alimentares</span><span class="valor" id="p-restricoes">—</span></div>
    <div class="linha-perfil"><span class="rotulo">Alojamento</span><span class="valor" id="p-alojamento">—</span></div>
    <div class="linha-perfil"><span class="rotulo">Quarto</span><span class="valor" id="p-quarto">—</span></div>
    <div class="linha-perfil"><span class="rotulo">Turno refeição</span><span class="valor" id="p-turno">—</span></div>

    <div class="agenda-hoje">
      <h4>PROGRAMA DE HOJE</h4>
      <div id="p-agenda"></div>
    </div>

    <div class="acoes-checkin">
      <h4 style="font-size:12px; color:var(--muted); margin:0 0 8px;">1. ESCOLHE O TIPO DE CHECK-IN</h4>
      <div class="linha-tipo">
        <div class="tipo-opcao ativo" data-tipo="evento" onclick="escolherTipo('evento')">Evento</div>
        <div class="tipo-opcao" data-tipo="alojamento" onclick="escolherTipo('alojamento')">Alojamento</div>
        <div class="tipo-opcao" data-tipo="almoco" onclick="escolherTipo('almoco')">Almoço</div>
        <div class="tipo-opcao" data-tipo="jantar" onclick="escolherTipo('jantar')">Jantar</div>
      </div>
      <div id="tipo-confirmado" style="font-size:12px; color: var(--accent); margin-bottom:14px;">Tipo selecionado: Evento</div>

      <h4 style="font-size:12px; color:var(--muted); margin:0 0 8px;">2. REGISTA A ENTRADA OU SAÍDA</h4>
      <div class="linha-acoes">
        <button class="botao-acao entrada" onclick="registarCheckin('entrada')">✓ Entrada</button>
        <button class="botao-acao saida" onclick="registarCheckin('saida')">✕ Saída</button>
      </div>
    </div>
  </div>

  <div class="secao-extra">
    <button class="botao-secao-extra" onclick="alternarSecao('recentes')">🕓 Correções recentes (anular um check-in) ▾</button>
    <div class="painel-secao-extra" id="painel-recentes"></div>
  </div>

  <div class="secao-extra">
    <button class="botao-secao-extra" onclick="alternarSecao('faltam')">❗ Quem falta registar ▾</button>
    <div class="painel-secao-extra" id="painel-faltam"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script>
    let staffAtual = null;
    let participanteAtual = null;
    let tipoSelecionado = 'evento';

    init();

    async function init() {
      const user = await exigirSessaoStaff();
      if (!user) return;

      staffAtual = await getStaffAtual(user);
      if (!staffAtual) {
        document.getElementById('saudacao-staff').textContent = 'Conta sem acesso de staff.';
        return;
      }

      document.getElementById('saudacao-staff').textContent = `Olá, ${staffAtual.nome ?? 'staff'} 👋`;
      iniciarCamara();
    }

    // -----------------------------------------------------------------
    // Câmara (só funciona em https:// ou http://localhost — nunca em
    // file://, por restrição de segurança do browser)
    // -----------------------------------------------------------------
    function iniciarCamara() {
      const aviso = document.getElementById('aviso-camara');

      if (location.protocol === 'file:') {
        aviso.style.display = 'block';
        aviso.textContent = 'A câmara não funciona a abrir o ficheiro diretamente (file://). Usa o campo manual abaixo, ou corre este ficheiro num servidor local (ex: Live Server / localhost) para testares a câmara.';
        return;
      }

      try {
        const html5QrCode = new Html5Qrcode('reader');
        html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 240 },
          (codigoLido) => processarCodigo(codigoLido),
          () => {} // ignora erros de frame sem QR (é normal, acontece a cada frame sem código visível)
        ).catch(() => {
          aviso.style.display = 'block';
          aviso.textContent = 'Não foi possível aceder à câmara. Usa o campo manual abaixo.';
        });
      } catch (e) {
        aviso.style.display = 'block';
        aviso.textContent = 'Não foi possível aceder à câmara. Usa o campo manual abaixo.';
      }
    }

    function procurarManual() {
      const codigo = document.getElementById('input-manual').value.trim();
      if (codigo) processarCodigo(codigo);
    }

    // -----------------------------------------------------------------
    async function processarCodigo(codigo) {
      mostrarMensagem('A procurar…');
      document.getElementById('cartao-perfil').style.display = 'none';

      const { data: participante, error } = await supabaseClient
        .from('participantes')
        .select('*')
        .eq('qr_code', codigo)
        .single();

      if (error || !participante) {
        mostrarMensagem(`Código "${codigo}" não encontrado.`, 'erro');
        participanteAtual = null;
        return;
      }

      participanteAtual = participante;
      mostrarMensagem('');
      await renderPerfil(participante);
    }

    async function renderPerfil(p) {
      document.getElementById('p-nome').textContent = p.nome ?? '—';
      document.getElementById('p-junior').textContent = p.junior_empresa ?? '—';
      document.getElementById('p-universidade').textContent = p.universidade ?? '—';

      const elRestricoes = document.getElementById('p-restricoes');
      elRestricoes.textContent = p.restricoes_alimentares || 'Nenhuma';
      elRestricoes.className = 'valor' + (p.restricoes_alimentares && p.restricoes_alimentares !== 'Nenhuma' ? ' alerta' : '');

      document.getElementById('p-turno').textContent = p.turno_refeicao ?? 'Não atribuído';

      // Alojamento + quarto (mesma lógica usada nas outras páginas)
      if (p.alojamento) {
        const { data: alojamento } = await supabaseClient.from('alojamentos').select('nome').eq('id', p.alojamento).single();
        document.getElementById('p-alojamento').textContent = alojamento?.nome ?? '—';
      } else {
        document.getElementById('p-alojamento').textContent = 'Não atribuído';
      }

      if (p.quarto_id) {
        const { data: quarto } = await supabaseClient.from('quartos').select('numero').eq('id', p.quarto_id).single();
        document.getElementById('p-quarto').textContent = quarto?.numero ?? '—';
      } else {
        document.getElementById('p-quarto').textContent = 'Não atribuído';
      }

      // Programa de hoje
      const hoje = new Date().toISOString().split('T')[0];
      const { data: atividades } = await supabaseClient
        .from('atividades')
        .select('nome, hora_inicio, local')
        .eq('data', hoje)
        .order('hora_inicio', { ascending: true });

      const elAgenda = document.getElementById('p-agenda');
      elAgenda.innerHTML = '';
      if (!atividades || atividades.length === 0) {
        elAgenda.innerHTML = '<div class="item-agenda">Sem atividades hoje.</div>';
      } else {
        atividades.forEach(a => {
          const item = document.createElement('div');
          item.className = 'item-agenda';
          item.innerHTML = `<span class="hora">${a.hora_inicio?.slice(0,5) ?? '--:--'}</span><span>${a.nome} — 📍 ${a.local ?? '—'}</span>`;
          elAgenda.appendChild(item);
        });
      }

      document.getElementById('cartao-perfil').style.display = 'block';
    }

    const ROTULOS_TIPO = { evento: 'Evento', alojamento: 'Alojamento', almoco: 'Almoço', jantar: 'Jantar', refeicao: 'Refeição' };

    function escolherTipo(tipo) {
      tipoSelecionado = tipo;
      document.querySelectorAll('.tipo-opcao').forEach(el => {
        el.classList.toggle('ativo', el.dataset.tipo === tipo);
      });
      document.getElementById('tipo-confirmado').textContent = `Tipo selecionado: ${ROTULOS_TIPO[tipo]}`;

      if (document.getElementById('painel-faltam').classList.contains('aberto')) {
        carregarQuemFalta();
      }
    }

    async function registarCheckin(acao) {
      if (!participanteAtual) {
        mostrarMensagem('Procura primeiro um participante (câmara ou código manual).', 'erro');
        return;
      }

      const nomeParticipante = participanteAtual.nome;

      console.log('A registar check-in com:', { participante_id: participanteAtual.id, lido_por: staffAtual.id, tipo: tipoSelecionado, acao });

      const { error } = await supabaseClient.from('checkins').insert({
        participante_id: participanteAtual.id,
        lido_por: staffAtual.id,
        tipo: tipoSelecionado,
        acao: acao
      });

      if (error) {
        console.error('Erro ao registar check-in:', error);
        mostrarMensagem('Erro ao registar: ' + error.message + (error.hint ? ' — ' + error.hint : ''), 'erro');
        return;
      }

      mostrarMensagem(
        `${acao === 'entrada' ? 'Entrada' : 'Saída'} registada para ${nomeParticipante} (${ROTULOS_TIPO[tipoSelecionado]}).`,
        'sucesso'
      );

      // Prepara o ecrã para o próximo participante
      participanteAtual = null;
      document.getElementById('cartao-perfil').style.display = 'none';
      document.getElementById('input-manual').value = '';
      escolherTipo('evento');

      // Mantém a secção de correções recentes atualizada, se estiver aberta
      // (a de "quem falta" já é atualizada dentro de escolherTipo('evento') acima)
      if (document.getElementById('painel-recentes').classList.contains('aberto')) carregarRecentes();
    }

    // -----------------------------------------------------------------
    // Correções recentes: mostra os últimos check-ins e deixa anular.
    // -----------------------------------------------------------------
    function alternarSecao(nome) {
      const painel = document.getElementById(`painel-${nome}`);
      const abrir = !painel.classList.contains('aberto');
      painel.classList.toggle('aberto', abrir);
      if (abrir && nome === 'recentes') carregarRecentes();
      if (abrir && nome === 'faltam') carregarQuemFalta();
    }

    async function carregarRecentes() {
      const painel = document.getElementById('painel-recentes');
      painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">A carregar…</div>';

      const { data, error } = await supabaseClient
        .from('checkins')
        .select('id, tipo, acao, criado_em, participantes(nome)')
        .order('criado_em', { ascending: false })
        .limit(15);

      if (error) {
        painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">Não foi possível carregar.</div>';
        console.error('Erro ao ir buscar check-ins recentes:', error.message, error.details, error.hint);
        return;
      }

      if (!data || data.length === 0) {
        painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">Ainda não há check-ins registados.</div>';
        return;
      }

      painel.innerHTML = '';
      data.forEach(c => {
        const hora = new Date(c.criado_em).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const linha = document.createElement('div');
        linha.className = 'linha-recente';
        linha.innerHTML = `
          <div>
            <div><span class="tag-acao ${c.acao}">${c.acao === 'entrada' ? 'Entrada' : 'Saída'}</span>${c.participantes?.nome ?? 'Participante removido'}</div>
            <div class="detalhe-recente">${ROTULOS_TIPO[c.tipo] ?? c.tipo} · ${hora}</div>
          </div>
          <button class="botao-anular" onclick="anularCheckin('${c.id}')">Anular</button>
        `;
        painel.appendChild(linha);
      });
    }

    async function anularCheckin(checkinId) {
      const { error } = await supabaseClient.from('checkins').delete().eq('id', checkinId);
      if (error) {
        mostrarMensagem('Erro ao anular: ' + error.message, 'erro');
        return;
      }
      mostrarMensagem('Check-in anulado.', 'sucesso');
      await carregarRecentes();
      if (document.getElementById('painel-faltam').classList.contains('aberto')) carregarQuemFalta();
    }

    // -----------------------------------------------------------------
    // Quem falta registar (para o tipo atualmente selecionado acima).
    // -----------------------------------------------------------------
    async function carregarQuemFalta() {
      const painel = document.getElementById('painel-faltam');
      painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">A carregar…</div>';

      const { data: todos, error: erroTodos } = await supabaseClient
        .from('participantes')
        .select('id, nome')
        .order('nome', { ascending: true });

      const { data: jaFeitos, error: erroFeitos } = await supabaseClient
        .from('checkins')
        .select('participante_id')
        .eq('tipo', tipoSelecionado)
        .eq('acao', 'entrada');

      if (erroTodos || erroFeitos) {
        painel.innerHTML = '<div class="estado-carregamento" style="padding:14px 0;">Não foi possível carregar.</div>';
        console.error('Erro ao ir buscar quem falta:', erroTodos || erroFeitos);
        return;
      }

      const feitosSet = new Set((jaFeitos ?? []).map(c => c.participante_id));
      const faltam = (todos ?? []).filter(p => !feitosSet.has(p.id));

      painel.innerHTML = `
        <div class="cabecalho-faltam">
          <span>Faltam ${faltam.length} de ${todos.length} (${ROTULOS_TIPO[tipoSelecionado]})</span>
        </div>
        <div class="lista-faltam" id="lista-faltam"></div>
      `;

      const lista = document.getElementById('lista-faltam');
      if (faltam.length === 0) {
        lista.innerHTML = '<div class="item-falta">Toda a gente já está registada! 🎉</div>';
        return;
      }

      faltam.forEach(p => {
        const item = document.createElement('div');
        item.className = 'item-falta';
        item.textContent = p.nome;
        lista.appendChild(item);
      });
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = 'mensagem' + (tipo ? ' ' + tipo : '');
    }

    async function terminarSessaoStaff() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
